<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Name and City</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 300px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        label, input {
            display: block;
            margin-bottom: 10px;
        }
        input[type="submit"], button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover, button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>CGI test</h1>
    
    <h2>POST method (with path_info)</h2>
    <form action="/cgi-bin/echo.py/path/info" method="post">
        <div>
            <label for="name_post">Name:</label>
            <input type="text" id="name_post" name="name" required>
        </div>
        <div>
            <label for="message_post">Message:</label>
            <textarea id="message_post" name="message" required></textarea>
        </div>
        <div>
            <input type="submit" value="Send POST request">
        </div>
    </form>

    <h2>GET method (with path_info)</h2>
    <form action="/cgi-bin/echo.py/additional/info" method="get">
        <div>
            <label for="name_get">Name:</label>
            <input type="text" id="name_get" name="name" required>
        </div>
        <div>
            <label for="message_get">Message:</label>
            <textarea id="message_get" name="message" required></textarea>
        </div>
        <div>
            <input type="submit" value="Send GET request">
        </div>
    </form>

    <body>
        <div class="section">
            <h2>GETリクエスト</h2>
            <form id="getForm" onsubmit="handleSubmit(event)" class="upload-form">
                <input type="text" id="pathInput" class="input-field" placeholder="パスを入力" required>
                <button type="submit" class="button">GETリクエスト送信</button>
            </form>
        </div>
        <!-- rest of the content remains same -->
    
        <script>
            function handleSubmit(event) {
                event.preventDefault();
                const path = document.getElementById('pathInput').value;
                window.location.href = path;
            }
        </script>
    </body>
    </html>



    <h1>File Upload</h1>
    <form id="uploadForm">
        <input type="file" id="fileInput" name="file">
        <button type="button" onclick="uploadFile()">Upload</button>
    </form>
    <br>
    <h1>File Delete</h1>
    <form id="deleteForm">
        <input type="text" id="fileNameInput" name="fileName" placeholder="Enter file name to delete">
        <button type="button" onclick="deleteFile()">Delete</button>
    </form>

    <h2>GET Request to show response</h2>
    <form id="getForm">
        <input type="text" id="getPath" placeholder="Enter path (/storage/uploads)">
        <button type="button" onclick="sendGetRequest()">Send GET Request</button>
    </form>
    <div id="getResponse"></div>

    <script>
        function uploadFile() {
            var fileInput = document.getElementById('fileInput');
            var file = fileInput.files[0];
            if (!file) {
                alert('Please select a file to upload.');
                return;
            }
            var xhr = new XMLHttpRequest();
            
            xhr.open('PUT', "/uploads/" + encodeURIComponent(file.name), true);
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status <=300) {
                    alert('File "' + file.name + '" uploaded successfully.');
                    xhr.open('PUT', "/uploads?filename=" + encodeURIComponent(file.name), true);
                } else {
                    alert('Upload failed. Error code: ' + xhr.status);
                }
            };
            xhr.onerror = function() {
                alert('An error occurred during the upload.');
            };
            xhr.send(file);
        }

        function deleteFile() {
            var fileName = document.getElementById('fileNameInput').value;
            if (!fileName) {
                alert('Please enter a file name to delete.');
                return;
            }
            var xhr = new XMLHttpRequest();
            
            xhr.open('DELETE', "/uploads/" + encodeURIComponent(fileName), true);
            xhr.onload = function() {
                if (xhr.status === 204) {
                    alert('File "' + fileName + '" deleted successfully.');
                } else {
                    alert('Deletion failed. Error code: ' + xhr.status);
                }
            };
            xhr.onerror = function() {
                alert('An error occurred during deletion.');
            };
            xhr.send();
        }

        function sendGetRequest() {
    var path = document.getElementById('getPath').value;
    if (!path) {
        alert('Please enter a path for the GET request.');
        return;
    }
    var xhr = new XMLHttpRequest();
    
    xhr.open('GET', path, true);
    xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
            document.getElementById('getResponse').innerText = 'Response: ' + xhr.responseText;
        } else {
            document.getElementById('getResponse').innerText = 'Request failed. Status: ' + xhr.status;
        }
    };
    xhr.onerror = function() {
        document.getElementById('getResponse').innerText = 'An error occurred during the request.';
    };
    xhr.send();
}
    </script>
</body>
</html>
